# Dataset D-small: 2.5 weeks hourly (quick iteration)
# 0.5wk coldstart + 1wk train + 0.5wk val + 0.5wk test
# ~12.5 trading days × 4 bars × 10 tickers = ~500 episodes
benchmark:
  tickers: ["AAPL", "NVDA", "JNJ", "UNH", "JPM", "GS", "XOM", "PG", "CAT", "NEE"]
  start_date: "2025-03-03"
  end_date: "2025-03-21"
  train_end_date: "2025-03-10"
  val_end_date: "2025-03-14"
  frequency: "1h"
  bars_per_day: 4
  prediction_horizons: [1, 2, 4]  # bars: 1bar=2h, 2bar=4h, 4bar=8h
  flat_threshold: 0.001
