# Step 2: tool_only + memory
# Adds 3-tier memory to tool_only baseline. Memory policy bandit learns.
# warm_up_episodes=15 (bars, not ticker-episodes): first 100 episodes behave as tool_only
name: tool_memory
seed: 42
num_episodes: 10000
log_dir: logs/tool_memory

planner:
  enabled_planners: ["sequential"]
  selection_method: fixed
  fixed_planner: sequential
  evolve: false

tools:
  enabled_tools: []
  selection_method: fixed
  max_tools_per_step: 5
  evolve: false

memory:
  enabled_tiers: ["episodic", "semantic", "procedural"]
  retrieval_top_k: 5
  retrieval_method: hybrid
  write_quality_threshold: 0.3
  eviction_min_score: 0.2
  max_entries_per_tier: 500
  evolve: true
  backend: local

credit:
  method: uniform

reflection:
  enabled: false

cold_start:
  enabled: false

skills:
  enabled: false

warm_up_episodes: 15

benchmark:
  tickers: ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "TSLA", "META", "NFLX", "AMD", "CRM"]
  start_date: "2025-01-02"
  end_date: "2025-03-28"
  prediction_horizons: [1, 7, 14]

llm_model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
llm_temperature: 0.3
