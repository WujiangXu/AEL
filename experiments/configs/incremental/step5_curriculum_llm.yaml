# Curriculum LLM credit: uniform → LLM-FCC transition
# Best of all worlds: stable early learning (uniform), then LLM-driven
# causal credit once there's enough context for meaningful attribution
name: step5_curriculum_llm
seed: 42
num_episodes: 10000
log_dir: logs/step5_curriculum_llm

planner:
  enabled_planners: ["sequential", "decompose", "adaptive", "cot_reasoning", "reflexion", "hypothesis_test"]
  selection_method: linucb
  evolve: true
  linucb_alpha: 1.0

tools:
  enabled_tools: []
  selection_method: thompson
  max_tools_per_step: 5
  evolve: true
  per_tool_selection: true

memory:
  enabled_tiers: ["episodic", "semantic", "procedural"]
  retrieval_top_k: 5
  retrieval_method: hybrid
  write_quality_threshold: 0.3
  eviction_min_score: 0.2
  max_entries_per_tier: 500
  evolve: true
  backend: local

credit:
  method: curriculum_llm
  curriculum_switch_episode: 60
  use_counterfactual: true
  use_shapley: true
  shapley_interval: 40
  fcc_weight_structural: 0.2
  fcc_weight_counterfactual: 0.4
  fcc_weight_shapley: 0.4

reflection:
  enabled: true
  structural_problem_threshold: 3
  max_planner_pool_size: 10
  planner_probation_days: 5
  evolve_planners: true
  evolution_sessions_per_day: 2

cold_start:
  enabled: true

skills:
  enabled: true
  extract_tools: true
  extract_templates: true
  extract_strategies: true
  extraction_interval_days: 3
  max_skills_per_type: 15
  skill_probation_episodes: 20

warm_up_episodes: 15

benchmark:
  tickers: ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "TSLA", "META", "NFLX", "AMD", "CRM"]
  start_date: "2025-01-02"
  end_date: "2025-03-28"
  prediction_horizons: [1, 7, 14]

llm_model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
llm_temperature: 0.3
