# Step 5a: +Memory + reflection + FCC credit (NO planner evolution, NO skills, NO cold-start)
# Tests whether credit assignment helps when isolated from planner exploration noise
name: step5a_credit_only
seed: 42
num_episodes: 10000
log_dir: logs/step5a_credit_only

planner:
  enabled_planners: ["sequential"]
  selection_method: fixed
  fixed_planner: sequential
  evolve: false

tools:
  enabled_tools: []
  selection_method: fixed
  max_tools_per_step: 5
  evolve: false

memory:
  enabled_tiers: ["episodic", "semantic", "procedural"]
  retrieval_top_k: 5
  retrieval_method: hybrid
  write_quality_threshold: 0.3
  eviction_min_score: 0.2
  max_entries_per_tier: 500
  evolve: true
  backend: local

credit:
  method: fcc
  use_counterfactual: true
  use_shapley: true
  shapley_interval: 80

reflection:
  enabled: true
  evolve_planners: false
  evolution_sessions_per_day: 2

cold_start:
  enabled: false

skills:
  enabled: false

warm_up_episodes: 15

benchmark:
  tickers: ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "TSLA", "META", "NFLX", "AMD", "CRM"]
  start_date: "2025-01-02"
  end_date: "2025-03-28"
  prediction_horizons: [1, 7, 14]

llm_model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
llm_temperature: 0.3
