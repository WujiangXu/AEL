# Method M2: Memory-only evolution (ExpeL-style) — XMem backend
# Fixed planner + tools, but memory accumulates and evolves
name: memory_only
seed: 42
num_episodes: 10000
log_dir: logs/memory_only

planner:
  enabled_planners: ["sequential"]
  selection_method: fixed
  fixed_planner: sequential
  evolve: false

tools:
  enabled_tools: []
  selection_method: fixed
  evolve: false

memory:
  enabled_tiers: ["episodic", "semantic", "procedural"]
  retrieval_top_k: 5
  retrieval_method: hybrid
  write_quality_threshold: 0.3
  eviction_min_score: 0.2
  max_entries_per_tier: 500
  evolve: true
  backend: local

credit:
  method: structural

benchmark:
  tickers: ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "TSLA", "META", "NFLX", "AMD", "CRM"]
  start_date: "2025-01-02"
  end_date: "2025-03-28"
  prediction_horizons: [1, 7, 14]

llm_model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
llm_temperature: 0.3
